<script>
    const chanID = 3226969;
    const readKey = 'G94OWZPH29BCZUOG';
    const maxDepth = 18.0; 
    let chart;

    function initChart() {
        chart = new Highcharts.Chart({
            chart: { renderTo: 'chart-container', type: 'areaspline', zoomType: 'x' },
            title: { text: null },
            xAxis: { type: 'datetime', crosshair: true },
            yAxis: { title: { text: null }, minPadding: 0.1, maxPadding: 0.1, startOnTick: false, endOnTick: false, labels: { format: '{value:.2f} m' } },
            legend: { enabled: false },
            plotOptions: { areaspline: { fillColor: { linearGradient: { x1: 0, y1: 0, x2: 0, y2: 1 }, stops: [[0, '#3498db'], [1, 'rgba(52,152,219,0)']] }, marker: { enabled: false }, lineWidth: 3, threshold: null } },
            series: [{ name: 'Hladina', data: [], color: '#2980b9' }],
            credits: { enabled: false }
        });
    }

    function updateView(days, mode, btn) {
        if (btn) {
            $('.btn').removeClass('active');
            $(btn).addClass('active');
        }

        let url = `https://api.thingspeak.com/channels/${chanID}/fields/1.json?api_key=${readKey}&results=8000`;
        if (days) url += `&days=${days}`;
        if (mode === 'daily') url += `&average=daily`;

        $.getJSON(url, function(data) {
            let points = [];
            $.each(data.feeds, function(i, f) {
                let v = parseFloat(f.field1);
                if (!isNaN(v)) points.push([new Date(f.created_at).getTime(), v]);
            });

            chart.series[0].setData(points);

            if (points.length > 0) {
                let last = points[points.length - 1];
                let lastTime = last[0];
                let now = new Date().getTime();
                
                // LOGIKA PRO AUTOMATICKÉ ODSTRANĚNÍ ALARMU:
                // Pokud je rozdíl mezi "teď" a "poslední data" menší než 24h, alarm se skryje.
                if (now - lastTime > 86400000) {
                    $('#offline-alert').fadeIn(); // Alarm se ukáže
                } else {
                    $('#offline-alert').fadeOut(); // Alarm sám zmizí, jakmile přijdou nová data
                }

                $('#last-val').text(last[1].toFixed(2) + ' m');
                $('#update-time').text('Aktualizováno: ' + new Date(lastTime).toLocaleString('cs-CZ'));
                let p = (last[1] / maxDepth) * 100;
                $('#water-level').css('height', Math.min(100, Math.max(0, p)) + '%');
            }
        });
    }

    $(document).ready(function() {
        initChart();
        updateView(1, 'raw', $('.btn.active'));

        // AUTOMATICKÁ AKTUALIZACE KAŽDÝCH 5 MINUT
        // To zajistí, že alarm zmizí sám od sebe bez klikání na web
        setInterval(function() {
            // Zjistíme, jaké období je zrovna vybrané, a to aktualizujeme
            let activeBtn = $('.btn.active');
            if (activeBtn.text().includes('ROK')) {
                updateView(365, 'daily');
            } else if (activeBtn.text().includes('MĚSÍC')) {
                updateView(31, 'raw');
            } else if (activeBtn.text().includes('TÝDEN')) {
                updateView(7, 'raw');
            } else {
                updateView(1, 'raw');
            }
        }, 300000); // 300 000 ms = 5 minut
    });
</script>
